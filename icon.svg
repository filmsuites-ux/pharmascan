<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10b981" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Rounded Base -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#10b981" stroke-opacity="0.2" stroke-width="4"/>

  <!-- Pharmacy Cross / Medical Pill Emblem -->
  <g filter="url(#shadow)">
    <!-- Vertical Bar -->
    <rect x="216" y="116" width="80" height="280" rx="40" fill="url(#emeraldGrad)"/>
    <!-- Horizontal Bar -->
    <rect x="116" y="216" width="280" height="80" rx="40" fill="url(#emeraldGrad)"/>
    <!-- Center Scanner Laser Accent -->
    <circle cx="256" cy="256" r="32" fill="#020617"/>
    <circle cx="256" cy="256" r="16" fill="#34d399"/>
  </g>
</svg>
