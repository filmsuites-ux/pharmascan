name: Build PharmaScan Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Print Node and npm versions
        run: |
          node -v
          npm -v
          npm install -g npm@^11.6.0
          node -v
          npm -v

      - name: Install Project Dependencies
        run: npm install --no-audit --no-fund

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK Packages
        run: |
          yes | sdkmanager --licenses || true
          yes | sdkmanager "platform-tools" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"

      - name: Run Test Suite
        run: npm test

      - name: Build Web Application
        run: npm run build

      - name: Initialize Android Native Project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Generate Release Signing Keystore
        run: |
          cd android
          keytool -genkeypair -v -keystore pharmascan-release.keystore \
            -alias pharmascan \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "pharmascan2026" -keypass "pharmascan2026" \
            -dname "CN=PharmaScan, OU=Pharmacy Management, O=PharmaScan Systems, L=Hyderabad, ST=Telangana, C=IN"

      - name: Build Debug and Release APKs
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          ./gradlew assembleRelease

      - name: Align and Sign Production Release APK
        run: |
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" | sort -V | tail -n 1)
          ZIPALIGN=$(find $ANDROID_HOME/build-tools -name "zipalign" | sort -V | tail -n 1)
          
          echo "Using zipalign at: $ZIPALIGN"
          echo "Using apksigner at: $APKSIGNER"

          $ZIPALIGN -v -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk android/app/build/outputs/apk/release/PharmaScan-aligned.apk
          $APKSIGNER sign --ks android/pharmascan-release.keystore --ks-pass pass:pharmascan2026 --ks-key-alias pharmascan --key-pass pass:pharmascan2026 --out android/app/build/outputs/apk/release/PharmaScan-production.apk android/app/build/outputs/apk/release/PharmaScan-aligned.apk
          
          echo "=== APKSIGNER VERIFICATION ==="
          $APKSIGNER verify --verbose --print-certs android/app/build/outputs/apk/release/PharmaScan-production.apk

      - name: Generate Checksums
        run: |
          echo "=== SHA-256 CHECKSUMS ==="
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk | tee android/debug-checksum.txt
          sha256sum android/app/build/outputs/apk/release/PharmaScan-production.apk | tee android/release-checksum.txt

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PharmaScan-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Production Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PharmaScan-production-apk
          path: android/app/build/outputs/apk/release/PharmaScan-production.apk
          if-no-files-found: error
